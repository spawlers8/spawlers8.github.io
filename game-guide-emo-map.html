<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《伊莫》互動地圖（雛形測試）</title>
<style>
  :root {
    --paper: #EDE6D3;
    --paper-deep: #DED2B0;
    --panel: #F4EEDD;
    --ink: #2A2420;
    --ink-soft: #6B6152;
    --seal: #A32F26;
    --seal-dark: #7E231C;
    --brass: #8C6A2F;
    --jade: #435F45;
    --border: #B9A97D;
    --border-soft: #CBBE95;
    --font-display: "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
  }
  .header {
    background: var(--ink);
    color: var(--panel);
    padding: 24px 20px;
    text-align: center;
  }
  .header h1 {
    font-family: var(--font-display);
    margin: 0 0 6px;
    font-size: 22px;
  }
  .header p {
    margin: 0;
    color: var(--border-soft);
    font-size: 13px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .notice {
    background: var(--panel);
    border-left: 4px solid var(--seal);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .region-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .region-tab {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 16px;
    border: 1.5px solid var(--ink);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  .region-tab.active { background: var(--seal); color: var(--panel); border-color: var(--seal); }

  .map-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--paper-deep);
    touch-action: none;
    cursor: grab;
  }
  .map-wrap.dragging { cursor: grabbing; }
  .map-inner {
    position: relative;
    transform-origin: 0 0;
    transition: transform 0.1s ease-out;
  }
  .map-inner img {
    display: block;
    width: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }
  .marker {
    position: absolute;
    width: 26px;
    height: 26px;
    margin-left: -13px;
    margin-top: -13px;
    background: var(--seal);
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(163,47,38,0.5), 0 2px 6px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(163,47,38,0), 0 2px 6px rgba(0,0,0,0.4); }
  }
  .zoom-controls {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zoom-btn {
    width: 32px; height: 32px;
    background: var(--ink);
    color: var(--panel);
    border: none;
    font-size: 18px;
    cursor: pointer;
    border-radius: 4px;
  }

  .popup {
    display: none;
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 18px;
  }
  .popup.show { display: block; }
  .popup-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-bottom: 8px; }
  .popup-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  .popup-row:last-child { border-bottom: none; }
  .popup-label { color: var(--ink-soft); }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 16px 0; }

  .back-link { display: inline-block; margin-bottom: 20px; font-size: 13px; color: var(--seal); text-decoration: none; }
</style>
</head>
<body>

  <div class="header">
    <h1>《伊莫》互動地圖（雛形測試）</h1>
    <p>點擊紅點查看伊莫資訊，可拖曳、縮放</p>
  </div>

  <div class="container">
    <a class="back-link" href="./game-guide-emo.html">← 回伊莫位置攻略</a>

    <div class="notice">
      「世界總覽」是完整地圖，方便你確認各區域大概方位，但<strong>目前還沒有標記任何伊莫位置</strong>——因為我沒辦法準確判斷區域截圖對應到世界地圖上的哪個位置，亂標會誤導你。如果你知道「鳶尾花海」「星落林」大概在世界地圖的哪個方位（例如「地圖左下角綠色草原那一帶」），跟我說一下，我就能把標記準確地加到世界地圖上；「鳶尾花海」「星落林」這兩個分頁則是原本的區域截圖，標記位置已經確認過是準的。
    </div>

    <div class="region-tabs" id="region-tabs"></div>
    <div class="map-wrap" id="map-wrap">
      <div class="map-inner" id="map-inner">
        <img id="map-img" src="" alt="地圖">
        <div id="markers-layer"></div>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">＋</button>
        <button class="zoom-btn" id="zoom-out">－</button>
        <button class="zoom-btn" id="zoom-reset" style="font-size:12px">重置</button>
      </div>
    </div>

    <div class="popup" id="popup"></div>
  </div>

<script>
const REGIONS = {
  worldmap: {
    label: "世界總覽",
    image: "./images/world_map_full.png",
    markers: []
  },
  yuanweihuahai: {
    label: "鳶尾花海",
    image: "./images/map_yuanweihuahai.png",
    markers: [
      { x: 56.7, y: 66.0, name: "刺劍玫", type: "雷雨型態", weather: "雨天 🌧 或雷雨天 ⛈", respawn: "同時間只會出現一隻，不會重複出現" },
    ]
  },
  xingluolin: {
    label: "星落林",
    image: "./images/map_xingluolin.png",
    markers: [
      { x: 29.4, y: 28.3, name: "長號鷗", type: "沙灘型態", weather: "雨天 🌧 或雷雨天 ⛈", respawn: "" },
    ]
  }
};

let currentRegion = "worldmap";
let scale = 1, panX = 0, panY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

const tabsEl = document.getElementById('region-tabs');
const wrapEl = document.getElementById('map-wrap');
const innerEl = document.getElementById('map-inner');
const imgEl = document.getElementById('map-img');
const markersEl = document.getElementById('markers-layer');
const popupEl = document.getElementById('popup');

function renderTabs() {
  tabsEl.innerHTML = Object.entries(REGIONS).map(([key, r]) =>
    `<button class="region-tab${key === currentRegion ? ' active' : ''}" data-region="${key}">${r.label}</button>`
  ).join('');
  tabsEl.querySelectorAll('.region-tab').forEach(btn => {
    btn.onclick = () => { currentRegion = btn.dataset.region; resetView(); loadRegion(); };
  });
}

function loadRegion() {
  const region = REGIONS[currentRegion];
  imgEl.src = region.image;
  popupEl.classList.remove('show');
  markersEl.innerHTML = region.markers.map((m, i) => `
    <div class="marker" style="left:${m.x}%;top:${m.y}%" data-idx="${i}">🐾</div>
  `).join('');
  markersEl.querySelectorAll('.marker').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      showPopup(region.markers[el.dataset.idx]);
    };
  });
  renderTabs();
}

function showPopup(m) {
  popupEl.classList.add('show');
  popupEl.innerHTML = `
    <div class="popup-name">${m.name}</div>
    <div class="popup-row"><span class="popup-label">型態</span><span>${m.type}</span></div>
    <div class="popup-row"><span class="popup-label">出現條件</span><span>${m.weather}</span></div>
    ${m.respawn ? `<div class="popup-row"><span class="popup-label">重生規則</span><span>${m.respawn}</span></div>` : ''}
  `;
}

function applyTransform() {
  innerEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}
function resetView() { scale = 1; panX = 0; panY = 0; applyTransform(); }

document.getElementById('zoom-in').onclick = () => { scale = Math.min(scale * 1.3, 4); applyTransform(); };
document.getElementById('zoom-out').onclick = () => { scale = Math.max(scale / 1.3, 0.6); applyTransform(); };
document.getElementById('zoom-reset').onclick = resetView;

wrapEl.addEventListener('mousedown', (e) => {
  dragging = true;
  wrapEl.classList.add('dragging');
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; wrapEl.classList.remove('dragging'); });

wrapEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  scale = Math.min(Math.max(scale * (e.deltaY < 0 ? 1.1 : 0.9), 0.6), 4);
  applyTransform();
}, { passive: false });

loadRegion();
</script>
</body>
</html>
