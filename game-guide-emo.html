<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《伊莫》伊莫位置攻略</title>
<style>
  :root {
    --paper: #EDE6D3;
    --paper-deep: #DED2B0;
    --panel: #F4EEDD;
    --ink: #2A2420;
    --ink-soft: #6B6152;
    --seal: #A32F26;
    --seal-dark: #7E231C;
    --brass: #8C6A2F;
    --jade: #435F45;
    --border: #B9A97D;
    --border-soft: #CBBE95;
    --font-display: "Noto Serif TC", serif;
    --font-body: "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.7;
  }
  .header {
    background: var(--ink);
    color: var(--panel);
    padding: 24px 20px;
    text-align: center;
  }
  .header h1 {
    font-family: var(--font-display);
    margin: 0 0 6px;
    font-size: 22px;
  }
  .header p {
    margin: 0;
    color: var(--border-soft);
    font-size: 13px;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--seal);
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .notice {
    background: var(--panel);
    border-left: 4px solid var(--seal);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 28px;
  }
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-btn {
    font-family: var(--font-body);
    font-size: 13px;
    padding: 7px 14px;
    border: 1.5px solid var(--ink);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--seal); color: var(--panel); border-color: var(--seal); }
  .emo-card {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .emo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    background: var(--paper-deep);
    border-bottom: 1px solid var(--border-soft);
  }
  .emo-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
  }
  .emo-type {
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--border-soft);
    padding: 2px 10px;
    border-radius: 3px;
  }
  .emo-img-wrap {
    width: 100%;
    background: var(--paper-deep);
  }
  .emo-img-wrap img {
    width: 100%;
    display: block;
  }
  .emo-info {
    padding: 16px 18px;
  }
  .emo-info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
  }
  .emo-info-row:last-child { border-bottom: none; }
  .emo-info-label { color: var(--ink-soft); flex-shrink: 0; margin-right: 16px; }
  .emo-info-value { text-align: right; font-weight: 500; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 700;
    background: var(--jade);
    color: var(--panel);
  }
  .tag.rain { background: #4a6fa5; }
  .red-box-note {
    font-size: 12px;
    color: var(--seal);
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--paper-deep);
  }
  .source-footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

  <div class="header">
    <h1>《伊莫》伊莫位置攻略</h1>
    <p>地圖上稀有伊莫的實際出現位置與出現條件</p>
  </div>

  <div class="container">

    <a class="back-link" href="./game-guide-index.html">← 回攻略選單</a>

    <div class="notice">
      紅框標示的是該伊莫實際出現的座標位置。部分伊莫**同時間地圖上只會出現一隻、且需要特定天氣才會刷新**，建議先確認天氣條件再前往蹲點，否則白跑一趟。持續更新中。
    </div>

    <div id="emo-list"></div>

    <div class="source-footer">
      內容為遊玩時截圖記錄，持續補充中。
    </div>

  </div>

<script>
const EMO_DATA = [
  {
    name: "刺劍玫",
    type: "雷雨型態",
    image: "./images/emo_ciijian_mei.png",
    location: "鳶尾花海",
    weather: "雨天 🌧 或雷雨天 ⛈",
    respawn: "同時間只會出現一隻，不會重複出現",
    note: "位於紅框位置"
  },
  {
    name: "長號鷗",
    type: "沙灘型態",
    image: "./images/emo_changhao_ou.png",
    location: "星落林",
    weather: "雨天 🌧 或雷雨天 ⛈",
    respawn: "",
    note: "位於紅框位置"
  },
];

const listEl = document.getElementById('emo-list');
listEl.innerHTML = EMO_DATA.map(e => `
  <div class="emo-card">
    <div class="emo-card-header">
      <span class="emo-name">${e.name}</span>
      <span class="emo-type">${e.type}</span>
    </div>
    <div class="emo-img-wrap"><img src="${e.image}" alt="${e.name} 位置圖" loading="lazy"></div>
    <div class="emo-info">
      <div class="emo-info-row"><span class="emo-info-label">出現地圖</span><span class="emo-info-value">${e.location}</span></div>
      <div class="emo-info-row"><span class="emo-info-label">出現條件</span><span class="emo-info-value"><span class="tag rain">${e.weather}</span></span></div>
      ${e.respawn ? `<div class="emo-info-row"><span class="emo-info-label">重生規則</span><span class="emo-info-value">${e.respawn}</span></div>` : ''}
      <div class="red-box-note">🔴 ${e.note}</div>
    </div>
  </div>
`).join('');
</script>

</body>
</html>
